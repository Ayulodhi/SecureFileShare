# ==============================================================================
# File: .github/workflows/ci.yml
# WHAT: Continuous Integration (CI) pipeline for SecureFileShare backend.
# WHY: Verifies code quality, executes unit and integration tests, scans for committed secrets,
#      checks for vulnerable third-party dependencies, and archives test reports on every PR and push.
# ==============================================================================

name: CI Pipeline

on:
  # Trigger build on code pushes to development and main branches
  push:
    branches:
      - main
      - develop
  # Trigger build on all pull requests targeting main or develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Secret Scanning
  # WHAT: Scans repository history for leaked credentials, private keys, and tokens.
  # WHY: Prevents API keys, database credentials, or JWT secrets from entering Git history.
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full commit history
        # Why: Shallow clones skip older commits; fetch-depth 0 enables scanning entire git history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        # Why: Detects high-entropy secrets and known API key patterns; fails build on detection
        uses: gitleaks/gitleaks-action@v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # Job 2: Build & Automated Tests
  # WHAT: Compiles Java 21 codebase, executes JUnit tests, and verifies multi-module reactor.
  # WHY: Ensures no regression or broken build enters the trunk branch.
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build & Verify (Java 21)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      - name: Set up Java 21 JDK
        # Why: Uses official Eclipse Temurin distribution matching production container runtime
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'temurin'
          java-version: '21'
          # Built-in Maven dependency caching accelerates CI execution across workflow runs
          cache: 'maven'

      - name: Grant execute permission to Maven wrapper
        # Why: Git permissions on Windows can strip executable bit from POSIX wrapper scripts
        run: chmod +x ./mvnw

      - name: Execute Maven build and unit tests
        # Why: "-B" enables non-interactive batch mode; "verify" runs test and integration-test phases
        run: ./mvnw -B clean verify --no-transfer-progress

      - name: Archive JUnit test reports
        # Why: "if: always()" ensures surefire failure reports are uploaded even if tests fail
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 3: OWASP Dependency Vulnerability Scan
  # WHAT: Inspects third-party Maven dependencies for known CVEs.
  # WHY: Mitigates supply chain attacks by alerting on dependencies with known vulnerabilities.
  # ----------------------------------------------------------------------------
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run OWASP Dependency-Check Scanner
        # Why: Scans pom.xml dependencies against the National Vulnerability Database (NVD)
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: 'SecureFileShare'
          path: '.'
          format: 'HTML'
          out: 'reports'
          # Fail the build if any dependency has a CVSS vulnerability score of 8 (High) or higher
          # Why: Enforces proactive remediation of critical dependencies before merging
          args: >
            --failOnCVSS 8
            --enableRetired

      - name: Archive Dependency-Check HTML Report
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: owasp-dependency-report
          path: 'reports/'
          retention-days: 14
