# ==============================================================================
# File: .github/workflows/ci.yml
# WHAT: Clean, robust CI workflow with full dependency checks and unit/integration tests.
# WHY: Verifies code quality and ensures smooth test execution without external pull blocks.
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build & Verify (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission to Maven wrapper
        run: chmod +x ./mvnw

      - name: Start local test infrastructure (Postgres, Redis)
        run: |
          docker compose up -d postgres redis
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U sfs_admin -d postgres 2>/dev/null; then
              echo "Postgres is ready."
              break
            fi
            echo "Waiting for postgres ($i/30)..."
            sleep 2
          done
          docker compose exec -T postgres psql -U sfs_admin -d postgres -c "CREATE DATABASE sfs_auth;" || true
          docker compose exec -T postgres psql -U sfs_admin -d postgres -c "CREATE DATABASE sfs_file;" || true
          docker compose exec -T postgres psql -U sfs_admin -d postgres -c "CREATE DATABASE sfs_share;" || true
          docker compose exec -T postgres psql -U sfs_admin -d postgres -c "CREATE DATABASE sfs_audit;" || true

      - name: Run Maven build and tests
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          DOCKER_API_VERSION: "1.44"
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: ./mvnw -B clean test --no-transfer-progress

      - name: Archive JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 14
