# ==============================================================================
# File: .github/workflows/ci.yml
# WHAT: Clean, streamlined Continuous Integration (CI) pipeline.
# WHY: Compiles Java 21 codebase and runs unit tests reliably without brittle testcontainers pulls.
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4.2.2

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant execute permission to Maven wrapper
        run: chmod +x ./mvnw

      - name: Compile and run unit tests
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: ./mvnw -B clean test --no-transfer-progress

      - name: Archive JUnit test reports
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 14
